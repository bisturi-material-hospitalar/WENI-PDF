# Blueprint do Render. Com este arquivo no repositório, o Render configura o
# serviço sozinho (Dashboard -> New -> Blueprint).
#
# As variáveis marcadas com sync:false NÃO ficam no arquivo: o Render pede o
# valor na interface, na criação. É assim que credencial não vai pro git.
services:
  - type: web
    name: bridge-danfe
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bridge_danfe:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # --- fixos, podem ficar no arquivo ---
      # Transporte do DANFE. NAO mexer para investigar defeito da cotacao: o DANFE esta
      # em producao com este valor. A cotacao tem variavel propria (COTACAO_STORAGE) e
      # pode ser testada em ftps sem tocar aqui.
      - key: STORAGE_BACKEND
        value: sftp
      # Porta do FTPS, usada pelos dois modulos quando o transporte e ftps.
      - key: FTPS_PORT
        value: "21"
      - key: SFTP_HOST
        value: arquivos-bisturi-com-br.umbler.net
      - key: SFTP_PORT
        value: "22"
      - key: SFTP_USER
        value: umbler
      # CORRECAO 03/09/2026: as DANFEs estao em /public/danfe no servidor da Umbler,
      # nao em /public_html/danfe. O valor errado aqui nao quebrou nada porque o
      # dashboard do Render tem o certo (o Blueprint so aplica na criacao), mas um
      # re-sync do Blueprint sobrescreveria e derrubaria DANFE e cotacao juntos.
      - key: SFTP_BASE_DIR
        value: /public/danfe
      - key: PUBLIC_BASE_URL
        value: https://arquivos.bisturi.com.br/danfe
      - key: VTEX_ENVIRONMENT
        value: vtexcommercestable
      # --- cotacao em PDF (pasta e URL proprias, separadas do DANFE) ---
      - key: COTACAO_BASE_DIR
        value: /public/cotacao
      - key: COTACAO_PUBLIC_BASE_URL
        value: https://arquivos.bisturi.com.br/cotacao
      # Casa com o "Cotacao valida por 24 horas" impresso no documento.
      - key: COTACAO_VALIDADE_HORAS
        value: "24"
      # --- segredos: preencher na interface do Render ---
      - key: BRIDGE_TOKEN
        sync: false
      - key: SFTP_PASSWORD
        sync: false
      - key: VTEX_ACCOUNT
        sync: false
      - key: VTEX_APP_KEY
        sync: false
      - key: VTEX_APP_TOKEN
        sync: false
