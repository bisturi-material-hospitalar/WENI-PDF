# Blueprint do Render. Com este arquivo no repositório, o Render configura o
# serviço sozinho (Dashboard -> New -> Blueprint).
#
# As variáveis marcadas com sync:false NÃO ficam no arquivo: o Render pede o
# valor na interface, na criação. É assim que credencial não vai pro git.
services:
  - type: web
    name: bridge-danfe
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bridge_danfe:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # --- fixos, podem ficar no arquivo ---
      # MEDIDO em 03/09/2026, de dentro do Render: porta 22 (SFTP) nao conecta
      # ([Errno 110]); porta 21 (FTPS) conecta e autentica. A Umbler oferece FTPS e SSH
      # apenas para git. Com `sftp` aqui, /danfe estourava 500 e /pregerar devolvia 502 —
      # calado, porque o /pregerar captura excecao por pedido e devolve 200.
      # As credenciais tem de ser de uma CONTA DE FTP criada no painel (Configuracoes ->
      # FTPS); a dupla mostrada ao lado da URL do site e credencial de hospedagem de
      # teste e devolve "530 Login authentication failed".
      - key: STORAGE_BACKEND
        value: ftps
      - key: FTPS_PORT
        value: "21"
      # Prazo de conexao. Sem ele, paramiko espera o timeout do sistema (~2 min) e o
      # proxy do Render devolve 502 antes, sem erro util no log.
      - key: SFTP_TIMEOUT
        value: "15"
      - key: SFTP_HOST
        value: arquivos-bisturi-com-br.umbler.net
      - key: SFTP_PORT
        value: "22"
      - key: SFTP_USER
        value: umbler
      # CORRECAO 03/09/2026: as DANFEs estao em /public/danfe no servidor da Umbler,
      # nao em /public_html/danfe. O valor errado aqui nao quebrou nada porque o
      # dashboard do Render tem o certo (o Blueprint so aplica na criacao), mas um
      # re-sync do Blueprint sobrescreveria e derrubaria DANFE e cotacao juntos.
      - key: SFTP_BASE_DIR
        value: /public/danfe
      - key: PUBLIC_BASE_URL
        value: https://arquivos.bisturi.com.br/danfe
      - key: VTEX_ENVIRONMENT
        value: vtexcommercestable
      # --- cotacao em PDF (pasta e URL proprias, separadas do DANFE) ---
      - key: COTACAO_BASE_DIR
        value: /public/cotacao
      - key: COTACAO_PUBLIC_BASE_URL
        value: https://arquivos.bisturi.com.br/cotacao
      # Casa com o "Cotacao valida por 24 horas" impresso no documento.
      - key: COTACAO_VALIDADE_HORAS
        value: "24"
      # --- segredos: preencher na interface do Render ---
      - key: BRIDGE_TOKEN
        sync: false
      - key: SFTP_PASSWORD
        sync: false
      - key: VTEX_ACCOUNT
        sync: false
      - key: VTEX_APP_KEY
        sync: false
      - key: VTEX_APP_TOKEN
        sync: false
